name: Regress
on:
  pull_request:
    branches: [main]
    paths:
      - 'regress/**'
      - '.github/workflows/regress.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: regress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: regress/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
