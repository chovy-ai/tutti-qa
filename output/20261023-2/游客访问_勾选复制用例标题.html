<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模块和用例标题 · 勾选确认</title><style>
:root{color-scheme:light dark;--bg:#fff;--fg:#242424;--line:#e5e5e5;--muted:#747474;--accent:#315de5}@media(prefers-color-scheme:dark){:root{--bg:#17191b;--fg:#e9e9e9;--line:#35383b;--muted:#aaa;--accent:#a9baff}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.toolbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 24px;background:var(--bg);border-bottom:1px solid var(--line)}button{font:inherit;font-size:13px;padding:5px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}button.primary{background:var(--accent);color:var(--bg)}button:disabled{opacity:.45;cursor:default}#count,#status{font-size:12px;color:var(--muted)}#count{margin-left:auto}main{max-width:1300px;padding:24px 32px 60px;margin:auto}ul{list-style:none;margin:0;padding:0}.module{margin:0 0 24px}.module>label{font-size:18px;font-weight:650}.module>ul,.group>ul{margin:8px 0 0 8px;padding-left:24px;border-left:1px solid var(--line)}.group{margin:12px 0}.group>label{font-size:14px;font-weight:600}.case{font-size:13px;font-weight:400;padding:4px 0;overflow-wrap:anywhere}label{display:flex;align-items:baseline;gap:9px;cursor:pointer}input[type=checkbox]{accent-color:var(--accent);flex-shrink:0;width:15px;height:15px;margin:0;transform:translateY(2px)}.case:has(input:not(:checked)) .title{color:var(--muted)}#manual{position:fixed;inset:0;background:#0007;z-index:4;display:flex;align-items:center;justify-content:center}#manual[hidden]{display:none}.dialog{width:min(900px,94vw);padding:20px;border-radius:8px;background:var(--bg)}textarea{width:100%;height:55vh;font:12px/1.6 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:10px}#manual p{margin:0 0 12px}#manual button{margin-top:10px}@media(max-width:600px){main{padding:20px 16px}.toolbar{padding:12px 16px}.module>ul,.group>ul{padding-left:14px;margin-left:4px}#count{margin-left:0}}
</style></head><body><div class="toolbar"><button id="all">全选</button><button id="none">全不选</button><button id="copy" class="primary">一键复制</button><output id="count" aria-live="polite">已选 99 / 99 条</output><span id="status" role="status"></span></div><main><ul id="tree"><li class="module"><label><input type="checkbox" checked class="module-check"><span class="title">房间管理 · 游客配置</span></label><ul><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">游客模式与讨论权限</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.1.0"><span class="title">开启游客模式、复制链接并完成首位游客准入 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.1.1"><span class="title">切换讨论开关并校验群聊和评论的完整权限链</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.1.2"><span class="title">讨论选择跨游客模式关闭和重开保持且不覆盖其他权限</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.1.3"><span class="title">关闭游客模式、保留历史并经房主恢复访问 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.2.0"><span class="title">非房主无权查看或修改游客管理配置</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.2.1"><span class="title">保存被拒绝后保持原配置并可重新提交</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.2.2"><span class="title">保存成功但读回失败时禁止继续写与复制旧链接</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.2.3"><span class="title">并发修改遇到旧版本时读回最新状态后再确认</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.2.4"><span class="title">模板限制讨论权限时保持禁用并在权限恢复后可操作</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.2.5"><span class="title">权限目录不可用时阻止启用并在目录恢复后完成准入</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.3.0"><span class="title">提交期间重复点击只产生一次有效变更</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.0.3.1"><span class="title">关闭面板后的迟到响应不污染重开或其他房间</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">游客邀请链接</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.1.0"><span class="title">暂停、刷新再启用保留同一邀请且区分已加入身份</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.1.1"><span class="title">更换链接后旧链接不可加入且已有游客保留</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.1.2"><span class="title">在会话中复制邀请只保留目标会话定位</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.1.3"><span class="title">已有历史配置初次补齐邀请后立即可复制且版本一致</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.2.0"><span class="title">复制失败保留真实链接并在恢复后成功复制</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">入口边界与能力说明</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.2.1.0"><span class="title">游客权限说明与实际讨论、读取和执行能力一致</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.2.2.0"><span class="title">公开房间不提供私人游客配置且普通房间入口不被污染</span></label></li></ul></li></ul></li><li class="module"><label><input type="checkbox" checked class="module-check"><span class="title">房间管理 · 成员与游客</span></label><ul><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">人员列表与身份变更</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.1.0"><span class="title">人员展示、角色状态筛选与分页完成完整核对</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.1.1"><span class="title">游客升级成员后校验席位、会话执行与刷新 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.1.2"><span class="title">成员降为游客后保留运行任务与历史并撤销共享 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.1.3"><span class="title">移出游客后保留历史并由房主恢复为游客</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.1.4"><span class="title">恢复已移出成员时重新检查名额并恢复正确身份</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.1.5"><span class="title">游客主动退出后关闭访问并保留历史</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.2.0"><span class="title">游客不能用成员邀请绕过房主自行升级</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.2.1"><span class="title">成员名额已满时升级失败后腾出名额再成功</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.2.2"><span class="title">人员版本冲突不把已移出的人错误升级</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.2.3"><span class="title">身份修改失败后保留菜单上下文并可重试</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.2.4"><span class="title">游客分页加载失败保留已有人员并可继续正确加载</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.3.0"><span class="title">游客超过成员限额仍可加入且升成员才检查席位</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.0.3.1"><span class="title">重复确认角色变更不重复占用席位</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">头像与本人管理边界</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.1.1.0"><span class="title">未分组游客显示真实头像且加载失败正常回退</span></label></li></ul></li></ul></li><li class="module"><label><input type="checkbox" checked class="module-check"><span class="title">房间 · 登录游客</span></label><ul><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">侧栏入口与房间身份</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.0.1.0"><span class="title">登录账号通过游客邀请入房并在侧栏持续访问 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.0.1.1"><span class="title">现有成员打开游客链接保持成员身份</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.0.2.0"><span class="title">同账号在成员房间与游客房间间切换不串权限</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.0.2.1"><span class="title">重复打开有效邀请不生成重复游客关系</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">默认会话、公告与正文浏览</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.1.1.0"><span class="title">共享会话、公告与持续更新的只读浏览 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.1.1.1"><span class="title">复制正文与引用只操作本地剪贴板</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.1.2.0"><span class="title">会话或公告读取失败后重试仍恢复原目标</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.1.3.0"><span class="title">长会话分页与中途新回复不重复不串会话</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">交付文件与房间资产</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.1.0"><span class="title">交付卡片到多入口预览、下载和内容核对 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.1.1"><span class="title">不支持预览的格式仍能完整取得原文件</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.1.2"><span class="title">文件中心筛选、分页与详情只读取房间授权资源</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.1.3"><span class="title">相对图片和附件从同一授权文档正确加载</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.2.0"><span class="title">文件预览失败后恢复同一文件且不影响会话</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.2.1"><span class="title">禁用资产读取后多个入口一致拒绝且恢复授权可读</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.2.2"><span class="title">跨房间和私有文件替换不能读取且合法文件仍可用</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.3.0"><span class="title">空资产和删除后的资源不展示成其他房间内容</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">网站与外链浏览</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.3.1.0"><span class="title">从交付网站到原域名、深路径与相对资源只读浏览 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.3.1.1"><span class="title">普通外链在新页打开并保留业务参数</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.3.2.0"><span class="title">网站未运行时明确不 const META={"batch": "20261023-2", "hash": "d8a340e4b0974a91"};
const tree=document.getElementById('tree'),cases=[...tree.querySelectorAll('.case-check')],status=document.getElementById('status'),manual=document.getElementById('manual'),text=document.getElementById('text');
function sync(){for(const group of tree.querySelectorAll('.group')){const children=[...group.querySelectorAll('.case-check')],box=group.querySelector('.group-check');box.checked=children.length>0&&children.every(x=>x.checked);box.indeterminate=children.some(x=>x.checked)&&!box.checked;}for(const mod of tree.querySelectorAll('.module')){const children=[...mod.querySelectorAll('.case-check')],box=mod.querySelector('.module-check');box.checked=children.length>0&&children.every(x=>x.checked);box.indeterminate=children.some(x=>x.checked)&&!box.checked;}const n=cases.filter(x=>x.checked).length;document.getElementById('count').textContent=`已选 ${n} / ${cases.length} 条`;document.getElementById('copy').disabled=n===0;status.textContent='';}
tree.addEventListener('change',event=>{const el=event.target;if(el.classList.contains('module-check')||el.classList.contains('group-check')){const parent=el.closest(el.classList.contains('module-check')?'.module':'.group');parent.querySelectorAll('.case-check').forEach(x=>x.checked=el.checked);}sync();});
document.getElementById('all').onclick=()=>{cases.forEach(x=>x.checked=true);sync();};document.getElementById('none').onclick=()=>{cases.forEach(x=>x.checked=false);sync();};
function buildText(){const lines=[];for(const mod of tree.querySelectorAll('.module')){const groupLines=[];for(const group of mod.querySelectorAll('.group')){const selected=[...group.querySelectorAll('.case')].filter(x=>x.querySelector('.case-check').checked);if(!selected.length)continue;groupLines.push('    '+group.querySelector(':scope > label > .title').textContent);selected.forEach(x=>groupLines.push('        '+x.querySelector('.title').textContent));}if(groupLines.length){lines.push(mod.querySelector(':scope > label > .title').textContent,...groupLines);}}lines.push('','TUTTI-QA-CASES '+JSON.stringify({batch:META.batch,hash:META.hash,decisions:cases.map(x=>({key:x.dataset.key,keep:x.checked}))}));return lines.join('\n');}
async function copyValue(value){try{await navigator.clipboard.writeText(value);return true;}catch{}text.value=value;manual.hidden=false;text.focus();text.select();let ok=false;try{ok=document.execCommand('copy')===true;}catch{}if(ok){manual.hidden=true;}else{manual.hidden=false;text.focus();text.select();}return ok;}
async function copySelected(){if(!cases.some(x=>x.checked))return;const value=buildText(),ok=await copyValue(value);status.textContent=ok?'已复制，可粘回对话':'请在弹窗中手动复制';}
document.getElementById('copy').onclick=copySelected;document.getElementById('retry').onclick=copySelected;document.getElementById('close').onclick=()=>manual.hidden=true;sync();
</script></body></html>
