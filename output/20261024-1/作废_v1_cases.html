<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模块和用例标题 · 勾选确认</title><style>
:root{color-scheme:light dark;--bg:#fff;--fg:#242424;--line:#e5e5e5;--muted:#747474;--accent:#315de5}@media(prefers-color-scheme:dark){:root{--bg:#17191b;--fg:#e9e9e9;--line:#35383b;--muted:#aaa;--accent:#a9baff}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.toolbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 24px;background:var(--bg);border-bottom:1px solid var(--line)}button{font:inherit;font-size:13px;padding:5px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}button.primary{background:var(--accent);color:var(--bg)}button:disabled{opacity:.45;cursor:default}#count,#status{font-size:12px;color:var(--muted)}#count{margin-left:auto}main{max-width:1300px;padding:24px 32px 60px;margin:auto}ul{list-style:none;margin:0;padding:0}.module{margin:0 0 24px}.module>label{font-size:18px;font-weight:650}.module>ul,.group>ul{margin:8px 0 0 8px;padding-left:24px;border-left:1px solid var(--line)}.group{margin:12px 0}.group>label{font-size:14px;font-weight:600}.case{font-size:13px;font-weight:400;padding:4px 0;overflow-wrap:anywhere}label{display:flex;align-items:baseline;gap:9px;cursor:pointer}input[type=checkbox]{accent-color:var(--accent);flex-shrink:0;width:15px;height:15px;margin:0;transform:translateY(2px)}.case:has(input:not(:checked)) .title{color:var(--muted)}#manual{position:fixed;inset:0;background:#0007;z-index:4;display:flex;align-items:center;justify-content:center}#manual[hidden]{display:none}.dialog{width:min(900px,94vw);padding:20px;border-radius:8px;background:var(--bg)}textarea{width:100%;height:55vh;font:12px/1.6 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:10px}#manual p{margin:0 0 12px}#manual button{margin-top:10px}@media(max-width:600px){main{padding:20px 16px}.toolbar{padding:12px 16px}.module>ul,.group>ul{padding-left:14px;margin-left:4px}#count{margin-left:0}}
</style></head><body><div class="toolbar"><button id="all">全选</button><button id="none">全不选</button><button id="copy" class="primary">一键复制</button><output id="count" aria-live="polite">已选 44 / 44 条</output><span id="status" role="status"></span></div><main><ul id="tree"><li class="module"><label><input type="checkbox" checked class="module-check"><span class="title">Computer 与 Agent 管理 / 云端电脑</span></label><ul><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">创建与状态</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.1.0"><span class="title">首次创建云端电脑并完成设置 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.1.1"><span class="title">云端电脑各状态的展示</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.2.0"><span class="title">云端电脑启动失败后重试</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.2.1"><span class="title">创建请求失败</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.2.2"><span class="title">读取云端环境失败</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.3.0"><span class="title">快速重复点击创建</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.1.3.1"><span class="title">本地房间配置页签不出现云端电脑</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">重启与删除</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.2.1.0"><span class="title">重启云端电脑后登录与数据保留 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.2.1.1"><span class="title">删除云端电脑后重新创建 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.2.1.2"><span class="title">取消重启与删除不执行</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.2.2.0"><span class="title">重启中断运行中的任务后在原会话继续</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.2.2.1"><span class="title">重启请求失败</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.2.2.2"><span class="title">删除时清理失败自动重试</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.2.2.3"><span class="title">不可重启时重启入口不可用</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.2.3.0"><span class="title">确认重启或删除时连续点击</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">版本与升级</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.3.1.0"><span class="title">检查更新：已是最新版本</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.3.1.1"><span class="title">手动升级到新版本 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.3.1.2"><span class="title">强制更新到期自动执行</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.3.1.3"><span class="title">升级过程中又发布新版本</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.3.2.0"><span class="title">升级失败自动恢复上一版本并重试</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.3.2.1"><span class="title">升级时正在运行的任务被结束后可继续</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.3.2.2"><span class="title">检查更新失败</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.3.2.3"><span class="title">提交升级时版本已变化</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.3.3.0"><span class="title">版本信息暂不可用</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">Provider 安装与登录</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.1.0"><span class="title">Claude Code 用官方账号登录 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.1.1"><span class="title">Codex 用一次性验证码登录 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.1.2"><span class="title">用 API Key 登录云端 Agent</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.1.3"><span class="title">用 Tutti 积分使用云端 Agent</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.1.4"><span class="title">安装与检查云端 Agent</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.2.0"><span class="title">授权码错误或过期后重新登录</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.2.1"><span class="title">登录请求失败</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.2.2"><span class="title">等待授权时刷新页面可继续</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.2.3"><span class="title">复制验证码失败</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.2.4"><span class="title">读取 Provider 管理状态失败</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.4.3.0"><span class="title">即将支持的 Agent 不能安装</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">在云端房间里使用</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.5.1.0"><span class="title">在云端房间用云端 Agent 完成任务 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.5.1.1"><span class="title">把云端 Agent 共享给房间成员使用</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.5.1.2"><span class="title">空闲后自动恢复执行</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.5.2.0"><span class="title">本地房间不出现云端 Agent</span></label></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">云端房间规格</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.6.1.0"><span class="title">创建性能型云端房间并核对资源 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.6.1.1"><span class="title">默认轻享型并关闭 root 创建</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.6.2.0"><span class="title">资源用量加载或刷新失败</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.6.3.0"><span class="title">创建后不能修改规格</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0.6.3.1"><span class="title">磁盘用量的统计范围</span></label></li></ul></li></ul></li></ul></main><div id="manual" hidden role="dialog" aria-modal="true" aria-labelledby="manual-title"><div class="dialog"><p id="manual-title">浏览器限制了自动复制，请复制下面已选内容，再粘回对话。</p><textarea id="text" readonly aria-label="已选用例确认结果"></textarea><button id="retry">重试复制</button><button id="close">关闭</button></div></div><script>
const META={"batch": "20261024-1", "hash": "ed7e3ae59431cfa9"};
const tree=document.getElementById('tree'),cases=[...tree.querySelectorAll('.case-check')],status=document.getElementById('status'),manual=document.getElementById('manual'),text=document.getElementById('text');
function sync(){for(const group of tree.querySelectorAll('.group')){const children=[...group.querySelectorAll('.case-check')],box=group.querySelector('.group-check');box.checked=children.length>0&&children.every(x=>x.checked);box.indeterminate=children.some(x=>x.checked)&&!box.checked;}for(const mod of tree.querySelectorAll('.module')){const children=[...mod.querySelectorAll('.case-check')],box=mod.querySelector('.module-check');box.checked=children.length>0&&children.every(x=>x.checked);box.indeterminate=children.some(x=>x.checked)&&!box.checked;}const n=cases.filter(x=>x.checked).length;document.getElementById('count').textContent=`已选 ${n} / ${cases.length} 条`;document.getElementById('copy').disabled=n===0;status.textContent='';}
tree.addEventListener('change',event=>{const el=event.target;if(el.classList.contains('module-check')||el.classList.contains('group-check')){const parent=el.closest(el.classList.contains('module-check')?'.module':'.group');parent.querySelectorAll('.case-check').forEach(x=>x.checked=el.checked);}sync();});
document.getElementById('all').onclick=()=>{cases.forEach(x=>x.checked=true);sync();};document.getElementById('none').onclick=()=>{cases.forEach(x=>x.checked=false);sync();};
function buildText(){const lines=[];for(const mod of tree.querySelectorAll('.module')){const groupLines=[];for(const group of mod.querySelectorAll('.group')){const selected=[...group.querySelectorAll('.case')].filter(x=>x.querySelector('.case-check').checked);if(!selected.length)continue;groupLines.push('    '+group.querySelector(':scope > label > .title').textContent);selected.forEach(x=>groupLines.push('        '+x.querySelector('.title').textContent));}if(groupLines.length){lines.push(mod.querySelector(':scope > label > .title').textContent,...groupLines);}}lines.push('','TUTTI-QA-CASES '+JSON.stringify({batch:META.batch,hash:META.hash,decisions:cases.map(x=>({key:x.dataset.key,keep:x.checked}))}));return lines.join('\n');}
async function copyValue(value){try{await navigator.clipboard.writeText(value);return true;}catch{}text.value=value;manual.hidden=false;text.focus();text.select();let ok=false;try{ok=document.execCommand('copy')===true;}catch{}if(ok){manual.hidden=true;}else{manual.hidden=false;text.focus();text.select();}return ok;}
async function copySelected(){if(!cases.some(x=>x.checked))return;const value=buildText(),ok=await copyValue(value);status.textContent=ok?'已复制，可粘回对话':'请在弹窗中手动复制';}
document.getElementById('copy').onclick=copySelected;document.getElementById('retry').onclick=copySelected;document.getElementById('close').onclick=()=>manual.hidden=true;sync();
</script></body></html>
