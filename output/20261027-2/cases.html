<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模块和用例标题 · 勾选确认</title><style>

anual button{margin-top:10px}@media(max-width:600px){main{padding:20px 16px}.toolbar{padding:12px 16px}.module>ul,.group>ul,.scene>ul{padding-left:14px;margin-left:4px}#count{margin-left:0}}
</style></head><body><div class="toolbar"><button id="all">全选</button><button id="none">全不选</button><button id="copy" class="primary">一键复制</button><output id="count" aria-live="polite">已选 41 / 41 条</output><span id="status" role="status"></span></div><main><ul id="tree"><li class="module"><label><input type="checkbox" checked class="module-check"><span class="title">引用与输入增强 / @ 智能体 / @ 自己的 Agent（补新接入的 Agent）</span></label><ul><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">用例</span></label><ul><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">用例</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.0"><span class="title">@ 自己的 Hermes Agent</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.1"><span class="title">@ 自己的 WorkBuddy</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.2"><span class="title">@ 自己的 Grok</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A0.3"><span class="title">@ 自己的 Antigravity</span></label></li></ul></li></ul></li></ul></li><li class="module"><label><input type="checkbox" checked class="module-check"><span class="title">引用与输入增强 / @ 智能体</span></label><ul><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">@ 云端 Agent</span></label><ul><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">正常场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.1.0"><span class="title">云端房间里 @ 我的云端 Agent 执行</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.1.1"><span class="title">成员共享的云端 Agent 可被 @</span></label></li></ul></li><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">异常场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.2.0"><span class="title">云端电脑离线或升级中时不可选</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.2.1"><span class="title">@ 云端 Agent 执行中云端电脑重启</span></label></li></ul></li><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">边界场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A1.0.3.0"><span class="title">本地房间的 @ 列表不出现云端 Agent</span></label></li></ul></li></ul></li></ul></li><li class="module"><label><input type="checkbox" checked class="module-check"><span class="title">引用与输入增强 / @ 任务</span></label><ul><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">任务页签与列表展示</span></label><ul><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">正常场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.0.0"><span class="title">切到「任务」页签查看本房间任务</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.0.1"><span class="title">关闭面板后筛选恢复默认</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.0.2"><span class="title">任务页签的筛选不影响其他页签</span></label></li></ul></li><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">异常场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.1.0"><span class="title">任务列表加载失败</span></label></li></ul></li><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">边界场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.0"><span class="title">本房间没有任务时的空态</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.1"><span class="title">任务标题或负责人名称超长</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.1.2.2"><span class="title">任务很多时的滚动与定位</span></label></li></ul></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">任务搜索与筛选</span></label><ul><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">正常场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.2.0.0"><span class="title">按标题搜索任务</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.2.0.1"><span class="title">切换「分配给我」与「全部任务」</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.2.0.2"><span class="title">勾选「包含已完成」</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.2.0.3"><span class="title">切换到其他房间查看任务</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.2.0.4"><span class="title">多个筛选组合</span></label></li></ul></li><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">异常场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.2.1.0"><span class="title">没加入或已退出的房间不出现</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.2.1.1"><span class="title">搜索任务无匹配</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.2.1.2"><span class="title">搜索房间无匹配</span></label></li></ul></li></ul></li><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">引用任务与执行</span></label><ul><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">正常场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.3.0.0"><span class="title">引用本房间任务后让 Agent 处理 · 全链路</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.3.0.1"><span class="title">引用其他房间的任务</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.3.0.2"><span class="title">键盘选择任务与删除引用</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.3.0.3"><span class="title">一次引用多个任务</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.3.0.4"><span class="title">任务与会话、文件、智能体组合引用</span></label></li></ul></li><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">异常场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.3.1.0"><span class="title">引用后发送前任务被修改</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.3.1.1"><span class="title">引用的任务被删除</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.3.1.2"><span class="title">没有权限的成员点击任务引用</span></label></li></ul></li><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">边界场景</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="A2.0.3.2.0"><span class="title">引用已完成的任务</span></label></li></ul></li></ul></li></ul></li><li class="module"><label><input type="checkbox" checked class="module-check"><span class="title">修改用例</span></label><ul><li class="group"><label><input type="checkbox" checked class="group-check"><span class="title">已有用例标题</span></label><ul><li class="scene"><label><input type="checkbox" checked class="scene-check"><span class="title">用例</span></label><ul><li class="case"><label><input type="checkbox" checked class="case-check" data-key="U0"><span class="title">应用分类下移除任务中心</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="U1"><span class="title">应用分类下移除任务中心</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="U2"><span class="title">应用分类下移除任务中心</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="U3"><span class="title">应用分类下移除任务中心</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="U4"><span class="title">应用分类下移除任务中心</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="U5"><span class="title">Tab 文案与窄屏翻页箭头</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="U6"><span class="title">Tab 文案与窄屏翻页箭头</span></label></li><li class="case"><label><input type="checkbox" checked class="case-check" data-key="U7"><span class="title">预期：立即弹出补全下拉菜单；默认选中“全部”分类；菜单分组显示（全部/文件/会话/协作/任务中心），按tab键可切换分类，上下箭头可切换选中</span></label></li></ul></li></ul></li></ul></li></ul></main><div id="manual" hidden role="dialog" aria-modal="true" aria-labelledby="manual-title"><div class="dialog"><p id="manual-title">浏览器限制了自动复制，请复制下面已选内容，再粘回对话。</p><textarea id="text" readonly aria-label="已选用例确认结果"></textarea><button id="retry">重试复制</button><button id="close">关闭</button></div></div><script>
const META={"batch": "20261027-2", "hash": "9019bc4694750209"};
const tree=document.getElementById('tree'),cases=[...tree.querySelectorAll('.case-check')],status=document.getElementById('status'),manual=document.getElementById('manual'),text=document.getElementById('text');
function sync(){for(const [sel,chk] of [['.scene','.scene-check'],['.group','.group-check'],['.module','.module-check']]){for(const node of tree.querySelectorAll(sel)){const children=[...node.querySelectorAll('.case-check')],box=node.querySelector(':scope > label > '+chk);box.checked=children.length>0&&children.every(x=>x.checked);box.indeterminate=children.some(x=>x.checked)&&!box.checked;}}const n=cases.filter(x=>x.checked).length;document.getElementById('count').textContent=`已选 ${n} / ${cases.length} 条`;document.getElementById('copy').disabled=n===0;status.textContent='';}
tree.addEventListener('change',event=>{const el=event.target;if(el.classList.contains('module-check')||el.classList.contains('group-check')||el.classList.contains('scene-check')){const parent=el.closest(el.classList.contains('module-check')?'.module':el.classList.contains('group-check')?'.group':'.scene');parent.querySelectorAll('.case-check').forEach(x=>x.checked=el.checked);}sync();});
document.getElementById('all').onclick=()=>{cases.forEach(x=>x.checked=true);sync();};document.getElementById('none').onclick=()=>{cases.forEach(x=>x.checked=false);sync();};
function buildText(){const lines=[],T=n=>n.querySelector(':scope > label > .title').textContent;for(const mod of tree.querySelectorAll('.module')){const groupLines=[];for(const group of mod.querySelectorAll('.group')){const sceneLines=[];for(const scene of group.querySelectorAll('.scene')){const selected=[...scene.querySelectorAll('.case')].filter(x=>x.querySelector('.case-check').checked);if(!selected.length)continue;sceneLines.push('        '+T(scene));selected.forEach(x=>sceneLines.push('            '+x.querySelector('.title').textContent));}if(sceneLines.length)groupLines.push('    '+T(group),...sceneLines);}if(groupLines.length){lines.push(T(mod),...groupLines);}}lines.push('','TUTTI-QA-CASES '+JSON.stringify({batch:META.batch,hash:META.hash,decisions:cases.map(x=>({key:x.dataset.key,keep:x.checked}))}));return lines.join('\n');}
async function copyValue(value){try{await navigator.clipboard.writeText(value);return true;}catch{}text.value=value;manual.hidden=false;text.focus();text.select();let ok=false;try{ok=document.execCommand('copy')===true;}catch{}if(ok){manual.hidden=true;}else{manual.hidden=false;text.focus();text.select();}return ok;}
async function copySelected(){if(!cases.some(x=>x.checked))return;const value=buildText(),ok=await copyValue(value);status.textContent=ok?'已复制，可粘回对话':'请在弹窗中手动复制';}
document.getElementById('copy').onclick=copySelected;document.getElementById('retry').onclick=copySelected;document.getElementById('close').onclick=()=>manual.hidden=true;sync();
</script></body></html>
