# 房间管理 · Web 端 / 房间信息编辑 / 房间头像支持自定义 / 正常场景
# 前置：编辑房间信息弹窗已打开；角色：房间所有者；入口：配色入口
# 操作：选择其他配色并点击保存
# 预期 1：头像配色更新成功，房间内展示新的配色
case: fd7da643-75bc-4d3e-9131-f68d51e572e0
title: 房主更换房间头像配色
sourceHash: 447860f873deab9d
mode: auto
actors:
  - owner
setup:
  - actor: owner
    flow: createRoom
    save: room
  - actor: owner
    flow: openRoom
    with:
      room: "{{room.name}}"
  - actor: owner
    flow: openRoomEditDialog
    with:
      room: "{{room.name}}"
steps:
  - actor: owner
    act: 在配色组中选择一个当前未选中的颜色，点击保存
  - actor: owner
    n: 1
    assert: 保存成功，弹窗已关闭，房间头像的背景色变为新选的颜色
    waitMs: 60000
