# 房间管理 · Web 端 / 房间信息面板 · 邀请与准入 / 允许新成员加入开关 / 正常场景
# 前置：房间准入开关已关闭；角色：已有成员；入口：邀请链接或房间列表
# 操作：已有成员打开链接或从列表进入房间
# 预期 1：权限授权 ｜ 已有成员不受准入开关影响，仍可免密进入房间
case: 0082df7d-7cf6-4471-bb3b-fa2f778950e3
title: 关闭不影响已有成员
sourceHash: 46c553e120fb6576
mode: auto
actors:
  - owner
  - member
setup:
  - actor: owner
    flow: createRoom
    save: room
  - actor: owner
    flow: copyInvite
    with:
      room: "{{room.name}}"
    save: invite
  - actor: member
    flow: joinWithInvite
    with:
      invite: "{{invite.invite}}"
      room: "{{room.name}}"
  - actor: owner
    flow: setAdmission
    with:
      room: "{{room.name}}"
      enabled: "false"
steps:
  - actor: member
    reload: true
  - actor: member
    act: 在左侧房间列表中点击房间「{{room.name}}」
  - actor: member
    n: 1
    assert: 成员已进入房间「{{room.name}}」，没有被要求输入密码，也没有被拒绝
    waitMs: 60000
