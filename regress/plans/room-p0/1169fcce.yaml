# 房间管理 · Web 端 / 房间信息面板 · 邀请与准入 / 游客访问 / 游客模式与讨论权限 / 正常场景
# 前置：独立测试房间 R，默认角色为房主 O、成员 M、登录游客 G、未加入账号 N；另备无权访问房间 R2。默认数据含共享会话 S1/S2、公告、群聊与评论、任务 T、自动化 A、共享 Agent、已交付文件 F、已运行网站 W；各资源记录唯一 ID；本条明确指定的初始关系、空态、运行状态和权限优先于上述默认夹具；实验功能「游客模式」已开启；讨论开关已开；G 打开两个标签页；角色：O、G、M；入口：游客访问 → 发表评论和群聊聊天
# 操作：G 先发群聊和全局评论 → O 关闭讨论开关 → G 从当前页和另一标签提交 → O 重新打开 → G 再发并刷新
# 预期 1：结果校验 ｜ 开启时两类消息成功，作者均为 G，M 收到且各只出现一次
# 预期 2：按钮状态 ｜ 关闭后群聊发送与会话评论写入均受限，旧标签不保留写权限
# 预期 3：提示文案 ｜ 登录游客受限时展示「当前游客权限不允许此操作。你可以浏览已授权内容；会话评论需由房主开启。」或对应只读说明
# 预期 4：可见范围 ｜ 已有群聊与评论仍可阅读，历史作者及引用不改变
# 预期 5：权限授权 ｜ 强制提交被服务端拒绝，不只依赖输入控件状态
# 预期 6：副作用 ｜ 讨论关闭不撤销共享会话和已授权资源的读取
# 预期 7：副作用 ｜ 不改动房间其他权限，不授予 Agent 执行
# 预期 8：恢复重试 ｜ 重新打开后以最新权限发送两类新文本成功
# 预期 9：持久化 ｜ 刷新后关闭期间未成功的文本不存在，新成功文本各一条
# 预期 10：列表展示 ｜ 人员身份和成员名额不因讨论开关发生变化
