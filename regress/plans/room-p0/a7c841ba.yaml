# 房间管理 · Web 端 / 房间信息面板 · 成员与共享 Agent / 游客身份与访问状态 / 人员列表与身份变更 / 正常场景
# 前置：独立测试房间 R，默认角色为房主 O、成员 M、登录游客 G、未加入账号 N；另备无权访问房间 R2。默认数据含共享会话 S1/S2、公告、群聊与评论、任务 T、自动化 A、共享 Agent、已交付文件 F、已运行网站 W；各资源记录唯一 ID；本条明确指定的初始关系、空态、运行状态和权限优先于上述默认夹具；实验功能「游客模式」已开启；游客模式已开启，必要读取权限明确为 true；角色：O、G、M；入口：成员与游客 → 移出房间/恢复为游客
# 操作：O 移出 G → G 从旧页、直达和新邀请重进 → M 查历史 → O 恢复为游客 → G 重新进入并发讨论
# 预期 1：提示文案 ｜ 移出确认说明无法访问且不能通过邀请自行回来，历史消息和评论保留
# 预期 2：权限授权 ｜ 移出后 G 不能再读写 R，刷新提示「你在此房间的成员资格已被撤销」
# 预期 3：权限授权 ｜ 换新邀请仍不能绕过 kicked 状态自助加入
# 预期 4：列表展示 ｜ O 列表状态为「已移出」且不重复生成人员行
# 预期 5：持久化 ｜ M 可看到 G 的旧消息与评论，内容和作者不变
# 预期 6：提示文案 ｜ 恢复说明「恢复为游客后，对方可以浏览和讨论，不获得协作权限。」
# 预期 7：恢复重试 ｜ 恢复后 G 能读 R 并按讨论开关发送，不能执行 Agent
# 预期 8：结果校验 ｜ 恢复不占成员名额，各端刷新关系一致
