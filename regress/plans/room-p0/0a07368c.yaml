# 房间管理 · Web 端 / 房间信息面板 · 邀请与准入 / 移除成员 / 正常场景
# 前置：成员已被移除房间
# 操作：成员重新加入房间
# 预期 1：可重新加入
case: 0a07368c-70b3-492a-ba6a-b6da62a67254
title: 移除后重新加入
sourceHash: eb47b4c2a1f2623e
mode: auto
actors:
  - owner
  - member
setup:
  - actor: owner
    flow: createRoom
    save: room
  - actor: owner
    flow: copyInvite
    with:
      room: "{{room.name}}"
    save: invite
  - actor: member
    flow: joinWithInvite
    with:
      invite: "{{invite.invite}}"
      room: "{{room.name}}"
  - actor: owner
    flow: openRoomInfoPanel
    with:
      room: "{{room.name}}"
  - actor: owner
    act: 在人类成员分类下悬停成员「{{member.displayName}}」，点击移除按钮，并在确认弹窗中点击移除成员
  - actor: member
    act: 如果出现成员资格已被撤销的提示，点击知道了
    cache: false
steps:
  - actor: member
    flow: joinWithInvite
    with:
      invite: "{{invite.invite}}"
  - actor: member
    n: 1
    assert: 被移除的成员重新加入成功，已进入房间「{{room.name}}」
    waitMs: 60000
