# 房间管理 · Web 端 / 房间信息面板 · 邀请与准入 / 游客访问 / 游客模式与讨论权限 / 正常场景
# 前置：独立测试房间 R，默认角色为房主 O、成员 M、登录游客 G、未加入账号 N；另备无权访问房间 R2。默认数据含共享会话 S1/S2、公告、群聊与评论、任务 T、自动化 A、共享 Agent、已交付文件 F、已运行网站 W；各资源记录唯一 ID；本条明确指定的初始关系、空态、运行状态和权限优先于上述默认夹具；实验功能「游客模式」已开启；G 已发送消息与评论；另有匿名访客正在浏览；角色：O、G、M、匿名访客；入口：游客访问 → 游客模式
# 操作：O 尝试关闭先取消 → 核对 G 仍可访问 → 再关闭并确认 → G 刷新 → O 重开 → 检查原关系 → O 恢复 G 为游客 → G 重进
# 预期 1：提示文案 ｜ 确认标题「确认变更房间访问？」，正文说明关闭后游客失去访问、历史保留、成员不受影响及重开不自动恢复
# 预期 2：副作用 ｜ 第一次取消没有提交关闭，G 的页面和权限不变
# 预期 3：权限授权 ｜ 确认关闭后 G 不能再取得房间新数据
# 预期 4：可见范围 ｜ 匿名访客在下一次成功访问校验后进入撤销态
# 预期 5：列表展示 ｜ O 看到原游客状态「游客模式已关闭」
# 预期 6：持久化 ｜ G 原群聊、评论及其作者保留，M 仍可阅读
# 预期 7：可用状态 ｜ M 可继续原成员任务与浏览
# 预期 8：结果校验 ｜ 重开生成可用的新邀请，旧链接不重新激活
# 预期 9：权限授权 ｜ 原游客不会随开关自动恢复为 active
# 预期 10：恢复重试 ｜ O 显式恢复后 G 可以重新访问，身份仍为游客
# 预期 11：副作用 ｜ 恢复不重复建关系、不重发历史消息、不自动恢复先前写操作
