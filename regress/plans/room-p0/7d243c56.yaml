# 房间管理 · Web 端 / 房间信息面板 · 成员与共享 Agent / 游客身份与访问状态 / 人员列表与身份变更 / 正常场景
# 前置：独立测试房间 R，默认角色为房主 O、成员 M、登录游客 G、未加入账号 N；另备无权访问房间 R2。默认数据含共享会话 S1/S2、公告、群聊与评论、任务 T、自动化 A、共享 Agent、已交付文件 F、已运行网站 W；各资源记录唯一 ID；本条明确指定的初始关系、空态、运行状态和权限优先于上述默认夹具；实验功能「游客模式」已开启；成员名额有空位；G 原先为 active 游客；角色：O、G；入口：成员与游客 → 管理 G 的身份
# 操作：O 对 G 设为成员 → 先取消再确认 → G 重新读取身份 → 创建会话并提交测试任务 → 刷新两端
# 预期 1：提示文案 ｜ 确认标题「确认变更房间访问？」，正文说明升成员占名额、降游客收回编辑和 Agent 操作
# 预期 2：副作用 ｜ 取消不改角色和计数
# 预期 3：列表展示 ｜ 确认后 G 为成员，成员数加一、游客数减一
# 预期 4：权限授权 ｜ G 获取成员权限后才能新建会话和调用有授权的 Agent
# 预期 5：会话状态 ｜ 新任务按成员链路执行并能读取最终结果
# 预期 6：可见范围 ｜ 不再显示游客身份标识和游客专属只读提示
# 预期 7：权限授权 ｜ 升级只作用 R，不改变 G 在 R2 的身份
# 预期 8：持久化 ｜ 两方刷新角色、计数及新会话结果一致
# 预期 9：副作用 ｜ 原游客消息与评论作者不变、不被复制
