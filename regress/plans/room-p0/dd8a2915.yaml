# 房间管理 · Web 端 / 房间信息面板 · 邀请与准入 / 游客访问 / 游客模式与讨论权限 / 正常场景
# 前置：独立测试房间 R，默认角色为房主 O、成员 M、登录游客 G、未加入账号 N；另备无权访问房间 R2。默认数据含共享会话 S1/S2、公告、群聊与评论、任务 T、自动化 A、共享 Agent、已交付文件 F、已运行网站 W；各资源记录唯一 ID；本条明确指定的初始关系、空态、运行状态和权限优先于上述默认夹具；实验功能「游客模式」已开启；R 的游客模式关闭；N 尚未加入；角色：O、N、M；入口：分享与成员 → 游客访问
# 操作：O 打开面板 → 开启游客模式 → 等待配置与链接读回 → 复制链接 → N 在另一浏览器打开并加入 → 浏览 S1 → O 核对列表与计数 → 双方刷新
# 预期 1：视觉展示 ｜ 初始关闭态展示「开启游客模式后生成链接」，复制入口不可用
# 预期 2：提示文案 ｜ 展示「让更多人查看进展、参与讨论」和「需登录 · 通过此链接加入后为游客」
# 预期 3：按钮状态 ｜ 保存及读回期间不可重复切换、改讨论权限或复制旧链接
# 预期 4：结果校验 ｜ 读回启用配置与可用游客邀请链接后才结束提交态
# 预期 5：提示文案 ｜ 复制成功提示「游客链接已复制」，剪贴板是本房间游客邀请
# 预期 6：权限授权 ｜ 首次开启的权限取服务端模板，前端没有把未授权的读取或执行置为允许
# 预期 7：提示文案 ｜ N 加入预览显示「以游客身份加入 · 可浏览和讨论 · 人数不限」
# 预期 8：结果校验 ｜ 确认后 N 成为 R 的游客且仅有一条有效关系
# 预期 9：跳转定位 ｜ 进入 R 并打开允许读取的共享会话 S1
# 预期 10：按钮状态 ｜ Agent 输入、成果编辑保持游客限制
# 预期 11：列表展示 ｜ O 的人员列表增加 N，游客数增加一次，成员数不变
# 预期 12：可见范围 ｜ M 的既有成员操作保持可用，不随游客模式降权
# 预期 13：持久化 ｜ 两方刷新后模式、关系、链接和计数与读回一致
