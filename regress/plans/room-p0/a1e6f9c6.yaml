# 房间管理 · Web 端 / Web 多标签页一致性 / 房间列表与房间信息的跨 tab 同步 / 正常场景（5）
# 前置：两个标签页都打开且都能看到同一个房间；角色：房主；入口：标签页 A 的房间信息弹窗
# 操作：在 A 中修改房间名称、头像与背景色并保存，观察 B
# 预期 1：列表展示 ｜ B 的房间列表与房间顶部标题同步更新为新值
# 预期 2：视觉展示 ｜ 头像与背景色同步，不出现 A 已改 B 仍是旧样式
case: a1e6f9c6-d720-440d-83d9-dd6aa165dd15
title: A 改房间名 B 同步更新
sourceHash: 5fc00a530b77bd47
mode: auto
actors:
  - owner
  - owner#2
setup:
  - actor: owner
    flow: createRoom
    save: room
  - actor: owner#2
    flow: openRoom
    with:
      room: "{{room.name}}"
  - actor: owner
    flow: openRoomEditDialog
    with:
      room: "{{room.name}}"
steps:
  - actor: owner
    act: 在弹窗中选择一个不同的头像图标和一个不同的背景色，把名称改为「{{room.name}}-new」，点击保存
  - actor: owner#2
    n: 1
    assert: （未刷新页面）左侧房间列表与房间顶部标题都更新为「{{room.name}}-new」
    waitMs: 30000
uncovered:
  - n: 2
    reason: 两个标签页的头像与背景色一致性需要跨截图比对，人工复核
