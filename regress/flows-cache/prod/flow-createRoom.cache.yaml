midsceneVersion: 1.16.5
cacheId: flow-createRoom
caches:
  - type: plan
    prompt: |-
      <CONTEXT>
      你在操作 Tutti 的 Web 端（Room 是多人与 Agent 协作的房间）。
      界面可能是中文或英文，按含义而非字面匹配按钮与文案。
      不要点击与当前任务无关的入口；遇到新手引导、欢迎页或可跳过的提示时先跳过。
      </CONTEXT>

      点击新建房间弹窗底部的完成或创建按钮
    yamlWorkflow: |
      tasks:
        - name: 点击新建房间弹窗底部的完成或创建按钮
          flow:
            - aiTap: ''
              locate: 新建房间弹窗底部的 Create room 按钮
