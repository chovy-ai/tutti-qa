# 房间管理 · Web 端 / 房间信息编辑 / 房间头像支持自定义 / 异常场景
# 前置：用户已加入其他用户创建的房间；角色：非房主成员；入口：配色区域
# 操作：点击配色入口或任意配色
# 预期 1：配色入口不可点击或不打开配色面板，房间头像不发生变化
case: 2d20ecda-9ae9-496f-a2e1-f99dde34fd55
title: 非房主无法点击配色
sourceHash: c7dccfdb58f57f95
mode: auto
actors:
  - owner
  - member
setup:
  - actor: owner
    flow: createRoom
    save: room
  - actor: owner
    flow: copyInvite
    with:
      room: "{{room.name}}"
    save: invite
  - actor: member
    flow: joinWithInvite
    with:
      invite: "{{invite.invite}}"
      room: "{{room.name}}"
steps:
  - actor: member
    act: 尝试打开房间信息编辑：点击房间左上角的房间头像；如果出现配色入口或颜色，点击任意一个
    cache: false
  - actor: member
    n: 1
    assert: 成员无法修改配色：配色入口不可点击或没有打开配色面板，房间头像没有变化
