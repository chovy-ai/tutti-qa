# 预期 2：列表展示 ｜ 包含房间头像图标组、房间背景色组与房间名称输入框，底部为取消与完成按钮
# 预期 3：结果校验 ｜ 名称输入框预填系统默认名称，头像与背景色各有一项处于选中态
case: 7d701650-28da-4712-911d-1e9c8992b081
title: 弹窗元素与默认值
sourceHash: a1dc1e7d4b63eb1c
mode: auto
actors:
  - owner
steps:
  - actor: owner
    act: 点击左侧房间分组标题旁的加号，在弹出的菜单中点击新建房间（如果没有菜单而是直接弹窗也可以）
    cache: false
  - actor: owner
    n: 1
    assert: 弹出了新建房间弹窗（Create room / New room）
