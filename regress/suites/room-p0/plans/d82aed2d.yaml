# 房间管理 · Web 端 / 房间信息面板 · 成员与共享 Agent / 游客身份与访问状态 / 人员列表与身份变更 / 正常场景
# 前置：独立测试房间 R，默认角色为房主 O、成员 M、登录游客 G、未加入账号 N；另备无权访问房间 R2。默认数据含共享会话 S1/S2、公告、群聊与评论、任务 T、自动化 A、共享 Agent、已交付文件 F、已运行网站 W；各资源记录唯一 ID；本条明确指定的初始关系、空态、运行状态和权限优先于上述默认夹具；实验功能「游客模式」已开启；人员覆盖四种状态及超过一页记录；记录真实人数和上限；角色：O；入口：游客访问 → 成员与游客
# 操作：O 查看全部 → 分别筛选成员和游客及各种状态 → 无结果筛选 → 恢复全部 → 加载后续页 → 重开
# 预期 1：列表展示 ｜ 每行显示相同账号的头像、名称、角色、访问状态
# 预期 2：视觉展示 ｜ O 行显示「我 · 房主」，不提供对自己的身份管理操作
# 预期 3：列表展示 ｜ 状态分别为在房间中、已退出、已移出、游客模式已关闭
# 预期 4：搜索筛选 ｜ 角色与状态组合只返回匹配项，空结果为「暂无符合筛选条件的人员。」
# 预期 5：列表展示 ｜ 含上限时按实际 members/limit 展示；无限额时不显示伪造的分母
# 预期 6：结果校验 ｜ 游客不占成员名额，各角色计数与权威返回一致
# 预期 7：归属与顺序 ｜ 翻页不重复人员、不丢漏，改变筛选重新按该条件加载
# 预期 8：持久化 ｜ 重开列表后状态与角色未被筛选操作修改
