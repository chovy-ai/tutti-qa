# 房间管理 · Web 端 / 房间信息面板 · 邀请与准入 / 游客访问 / 游客邀请链接 / 正常场景
# 前置：独立测试房间 R，默认角色为房主 O、成员 M、登录游客 G、未加入账号 N；另备无权访问房间 R2。默认数据含共享会话 S1/S2、公告、群聊与评论、任务 T、自动化 A、共享 Agent、已交付文件 F、已运行网站 W；各资源记录唯一 ID；本条明确指定的初始关系、空态、运行状态和权限优先于上述默认夹具；实验功能「游客模式」已开启；游客模式已开启，必要读取权限明确为 true；角色：O、N、G、匿名访客；入口：游客访问 → 链接设置
# 操作：O 暂停链接 → 关闭重开面板 → N 打开邀请 → G 重进 → 匿名访客等待校验 → O 启用原链接 → N 加入
# 预期 1：提示文案 ｜ 暂停态显示「游客链接已暂停」，说明「暂停链接只停止新加入，已有游客继续访问。」
# 预期 2：按钮状态 ｜ 暂停时不能复制可用邀请，重开面板不会自动启用
# 预期 3：结果校验 ｜ 暂停前后的链接标识不因读取面板被轮换
# 预期 4：提示文案 ｜ 未加入的 N 无法加入，提示「房间分享已关闭」
# 预期 5：权限授权 ｜ 已加入 G 仍可浏览既有共享内容
# 预期 6：权限授权 ｜ 匿名访客在下一次成功校验时失去分享资格
# 预期 7：恢复重试 ｜ 明确启用后原链接可加入 N，游客关系和计数只增加一次
# 预期 8：持久化 ｜ 刷新后链接为最终启用态，讨论开关未受影响
