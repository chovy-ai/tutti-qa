# 房间管理 · Web 端 / 房间信息面板 · 成员与共享 Agent / 游客身份与访问状态 / 人员列表与身份变更 / 正常场景
# 前置：独立测试房间 R，默认角色为房主 O、成员 M、登录游客 G、未加入账号 N；另备无权访问房间 R2。默认数据含共享会话 S1/S2、公告、群聊与评论、任务 T、自动化 A、共享 Agent、已交付文件 F、已运行网站 W；各资源记录唯一 ID；本条明确指定的初始关系、空态、运行状态和权限优先于上述默认夹具；实验功能「游客模式」已开启；M 是 active 成员，其 Agent 正向 R 共享且有在途任务；角色：O、M、另一成员；入口：成员与游客 → 管理 M 的身份
# 操作：M 启动一条测试任务并共享自己的 Agent 到 R → O 将 M 设为游客 → M 从旧标签发任务 → 等原任务完成 → 刷新并恢复成员验证
# 预期 1：列表展示 ｜ M 变为游客，成员数减一、游客数加一
# 预期 2：按钮状态 ｜ M 的新建、执行、成果编辑入口转为游客限制
# 预期 3：权限授权 ｜ 旧标签中的执行请求也被拒绝，不创建第二条任务
# 预期 4：会话状态 ｜ 降级前已经运行的任务不被中止，原结果正常回到会话
# 预期 5：归属与顺序 ｜ M 原会话、任务、消息仍留在 R，作者与先后关系不变
# 预期 6：可见范围 ｜ M 只可按游客权限浏览，不继续追问执行
# 预期 7：副作用 ｜ M 自有 Agent 停止向 R 共享；其他成员的共享不变
# 预期 8：权限授权 ｜ M 的 Agent 个人所有权及其他房间共享不被错误撤销
# 预期 9：持久化 ｜ 刷新后角色及 R 共享列表一致
# 预期 10：恢复重试 ｜ O 再设为成员后 M 可按成员权限工作，不自动重放降级期间被拒的任务
