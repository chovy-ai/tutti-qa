# 房间管理 · Web 端 / 退出房间 / 成员退出房间 / 正常场景
# 前置：退出确认弹窗已弹出；角色：房间成员；入口：退出按钮
# 操作：点击退出房间
# 预期 1：列表展示 ｜ 该房间从自己的房间列表移除，界面切换到列表中的第一个房间
# 预期 2：权限授权 ｜ 房间内的资产不再可见
# 预期 3：列表展示 ｜ 房主侧席位与成员列表实时恢复，无需手动刷新，其他成员的成员列表中不再有该成员
case: c68e89e5-2f33-49a0-ab3f-359dd975c1d2
title: 确认退出
sourceHash: 1833efe16ebb85d3
mode: auto
actors:
  - owner
  - member
setup:
  - actor: member
    flow: createRoom
    save: mine
  - actor: owner
    flow: createRoom
    save: room
  - actor: owner
    flow: copyInvite
    with:
      room: "{{room.name}}"
    save: invite
  - actor: member
    flow: joinWithInvite
    with:
      invite: "{{invite.invite}}"
      room: "{{room.name}}"
  - actor: owner
    flow: openRoomInfoPanel
    with:
      room: "{{room.name}}"
  - actor: member
    flow: openRoomMenu
    with:
      room: "{{room.name}}"
  - actor: member
    act: 点击菜单中的离开房间（Leave）
steps:
  - actor: member
    act: 在确认弹窗中点击退出房间
  - actor: member
    n: 1
    assert: 左侧房间列表中不再有「{{room.name}}」，界面切换到了列表中的第一个房间「{{mine.name}}」
    waitMs: 60000
  - actor: member
    n: 2
    assert: 当前页面没有展示房间「{{room.name}}」的任何内容或资产
  - actor: owner
    n: 3
    assert: （未刷新页面）房间信息面板的成员列表中不再有「{{member.displayName}}」，已占席位恢复为 1
    waitMs: 60000
